      <svg width="0" height="0">
        <defs>
          <filter id="wavy" x="-20%" y="-20%" width="140px" height="140px">
            <feTurbulence
              type="turbulence"
              numOctaves="2"
              seed="3"
              baseFrequency="0 0 0.2"
              result="noise"
            >
              <animate
                attributeName="baseFrequency"
                dur="6s"
                values="0 0.01; 0 0.03; 0 0.01"
                repeatCount="indefinite"
              />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" />
          </filter>
        </defs>
      </svg>
      <h1 style="filter: url(#wavy); font-size: 60px">Liquid Text</h1>
